<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
@page { size: 3.75in 2.25in; margin: 0; }
html, body { margin:0; width:360px; height:216px; overflow:hidden; background:#0B0D10; color:#F2F5F7;
  font-family:"Barlow",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
.card { position:relative; width:360px; height:216px; background:linear-gradient(135deg,#0B0E12 0%,#12201A 100%); }
/* 0.125in bleed + 0.125in safe = 24px in from each edge */
.safe { position:absolute; left:24px; top:24px; right:24px; bottom:24px; }
.wm { font-family:"Rajdhani"; font-weight:700; letter-spacing:.3em; }
.url { font-family:"Rajdhani"; font-weight:600; letter-spacing:.08em; color:#00E0A4; }
.mut { color:#95A1AC; }
</style></head><body>
<div class="card"><div class="safe" style="display:flex;flex-direction:column;justify-content:space-between">
  <div style="display:flex;align-items:center;gap:12px">
    <img src="icon.png" style="width:58px;height:58px;border-radius:13px">
    <div>
      <div class="wm" style="font-size:34px;line-height:.95">TRace</div>
      <div style="font-family:Rajdhani;font-weight:600;font-size:9.5px;letter-spacing:.3em;color:#95A1AC;margin-top:5px">PERFORMANCE RECORDER</div>
    </div>
  </div>
  <div>
    <div style="font-size:14px;font-weight:500;line-height:1.3">Every ride tells a story.<br><span class="mut">Now you've got the data.</span></div>
    <div class="url" style="font-size:16px;margin-top:9px">TraceTimer.com</div>
  </div>
</div></div></body></html>
