<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
@page { size: 2.25in 3.75in; margin: 0; }
html, body { margin:0; width:216px; height:360px; overflow:hidden; background:#0B0D10; color:#F2F5F7;
  font-family:"Barlow",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
.card { position:relative; width:216px; height:360px; overflow:hidden;
  background:radial-gradient(120% 70% at 20% 100%, #0F2A20 0%, #0B0E12 60%); }
.safe { position:absolute; left:24px; top:24px; right:24px; bottom:24px; }
.wm { font-family:"Rajdhani"; font-weight:700; letter-spacing:.3em; }
.url { font-family:"Rajdhani"; font-weight:600; letter-spacing:.08em; color:#00E0A4; }
.mut { color:#95A1AC; }
.streak { position:absolute; left:-40px; right:-40px; height:2px; background:linear-gradient(90deg, transparent, rgba(0,224,164,.55), transparent); }
</style></head><body>
<div class="card">
  <div class="streak" style="top:150px;transform:rotate(-14deg)"></div>
  <div class="streak" style="top:176px;transform:rotate(-14deg);opacity:.5"></div>
  <div class="safe" style="display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:8px">
      <img src="icon.png" style="width:30px;height:30px;border-radius:7px">
      <div class="wm" style="font-size:17px">TRace</div>
    </div>
    <div style="margin-top:auto;margin-bottom:auto">
      <div style="font-family:Rajdhani;font-weight:700;font-size:74px;line-height:.82;letter-spacing:-.01em">0–60</div>
      <div style="font-family:Rajdhani;font-weight:700;font-size:26px;line-height:1;color:#00E0A4;letter-spacing:.06em;margin-top:8px">¼ MILE. LAPS.</div>
      <div style="font-size:11.5px;font-weight:500;line-height:1.35;margin-top:12px">Timed by the phone in your pocket.<br><span class="mut">Then burned onto the video.</span></div>
    </div>
    <div>
      <div style="font-family:Rajdhani;font-weight:600;font-size:8.5px;letter-spacing:.28em;color:#95A1AC">NO HARDWARE. NO ACCOUNT.</div>
      <div class="url" style="font-size:15px;margin-top:3px">TraceTimer.com</div>
    </div>
  </div>
</div></body></html>
