<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>TRace Play feature graphic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* 1024 x 500: Google Play's feature graphic. Same palette and faces as
   tracetimer.com and the YouTube banner; the mark, the line, and the two
   overlay tiles that say what the app does without a word of copy. */
html, body { margin:0; width:1024px; height:500px; overflow:hidden; background:#0B0D10; color:#F2F5F7; font-family:"Barlow",system-ui,sans-serif; }
.bg { position:absolute; inset:0;
  background: radial-gradient(60% 150% at 78% 60%, rgba(0,224,164,.18), transparent 62%),
              linear-gradient(90deg, #0B0D10 0%, #11161c 55%, #0B0D10 100%); }
.road { position:absolute; left:58%; width:60%; bottom:-150px; height:330px;
  transform:perspective(420px) rotateX(56deg);
  background: repeating-linear-gradient(90deg, transparent 0 49.4%, #cfd6dc 49.4% 50.6%, transparent 50.6% 100%),
              linear-gradient(180deg, #252c34, #0d1115);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 45%); opacity:.5; }
.wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 56px 0 60px; gap:34px; box-sizing:border-box; }
.logo { width:190px; height:190px; border-radius:40px; flex:none; box-shadow:0 20px 60px rgba(0,0,0,.6); }
.brand { display:flex; flex-direction:column; }
.eyebrow { font-family:"Rajdhani"; font-weight:600; font-size:17px; letter-spacing:.34em; color:#95A1AC; margin:0 0 4px 5px; }
h1 { font-family:"Rajdhani"; font-weight:700; font-size:92px; letter-spacing:.2em; line-height:.9; margin:0; }
.tag { font-family:"Barlow"; font-size:27px; color:#F2F5F7; margin:16px 0 0 5px; font-weight:500; letter-spacing:.01em; }
.sub { font-size:19px; color:#95A1AC; margin:8px 0 0 5px; font-weight:500; }
.right { margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:14px; }
.tiles { display:flex; gap:9px; }
.tile { background:rgba(0,0,0,.5); border-radius:11px; padding:7px 11px 7px; min-width:84px; }
.tile .l { display:flex; align-items:center; gap:6px; font-family:"Rajdhani"; font-weight:700; font-size:12px; letter-spacing:.16em; color:rgba(255,255,255,.6); }
.tile .l i { width:8px; height:8px; border-radius:2px; display:inline-block; }
.tile .v { font-family:"Rajdhani"; font-weight:600; font-size:24px; line-height:1.05; color:#fff; font-variant-numeric:tabular-nums; }
.tile .u { height:3px; width:28px; border-radius:2px; margin-top:5px; }
.row { display:flex; align-items:flex-end; gap:26px; }
.run { background:rgba(0,0,0,.55); border-radius:13px; padding:8px 12px; display:grid; gap:4px; width:132px; }
.run .l { font-family:"Rajdhani"; font-weight:700; font-size:13px; letter-spacing:.16em; color:rgba(255,255,255,.65); }
.run .t { font-family:"Rajdhani"; font-weight:600; font-size:36px; line-height:1; color:#00E0A4; }
.run .bar { height:4px; border-radius:2px; background:rgba(255,255,255,.18); overflow:hidden; }
.run .bar i { display:block; height:100%; width:78%; background:#00E0A4; }
.speed { display:flex; align-items:baseline; gap:9px; }
.speed .n { font-family:"Rajdhani"; font-weight:300; font-size:96px; line-height:.85; color:#fff; text-shadow:0 4px 18px rgba(0,0,0,.6); }
.speed .u { font-family:"Rajdhani"; font-weight:600; font-size:18px; letter-spacing:.24em; color:rgba(255,255,255,.75); }
</style></head>
<body>
<div class="bg"></div><div class="road"></div>
<div class="wrap">
  <img class="logo" src="../img/icon-512.png" alt="">
  <div class="brand">
    <div class="eyebrow">PERFORMANCE RECORDER · BIKES AND CARS</div>
    <h1>TRace</h1>
    <div class="tag">Every ride leaves a TRace</div>
    <div class="sub">0–60, ¼ mile, laps. Your run, on film. Nothing leaves your phone.</div>
  </div>
  <div class="right">
    <div class="tiles">
      <div class="tile"><div class="l"><i style="background:#00E0A4"></i>RIDE</div><div class="v">12:41</div><div class="u" style="background:#00E0A4"></div></div>
      <div class="tile"><div class="l"><i style="background:#2C7BE5"></i>DIST</div><div class="v">8.2 mi</div><div class="u" style="background:#2C7BE5"></div></div>
    </div>
    <div class="row">
      <div class="run"><div class="l">0–60</div><div class="t">3.34</div><div class="bar"><i></i></div></div>
      <div class="speed"><span class="n">58</span><span class="u">MPH</span></div>
    </div>
  </div>
</div>
</body></html>
